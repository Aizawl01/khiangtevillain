name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html styles.css script.js brand.css brand.js learning.css mizo-prompts.js motion.js motion.css favicon.png _site/
          mkdir -p _site/assets
          cp assets/character.webp assets/portrait.webp assets/brand.webp assets/brand-film.mp4 assets/three.module.js assets/three.core.js assets/FLAQ-LICENSE.txt assets/THREE-LICENSE.txt _site/assets/
          cp -R prompt-packs _site/prompt-packs
          cp -R game _site/game
          cp -R cloud _site/cloud
          cp -R lab _site/lab
          cp -R lab _site/lab-v3
          cp -R lab _site/lab-v4
          cp -R lab _site/lab-v5
          cp -R lab _site/lab-v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static-site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
